name: Temporary Schedule Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '5 8 * * *' # 16:05 Asia/Shanghai on November 25, 2026

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record schedule trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_at_utc=$(date -u --iso-8601=seconds)"
          echo "commit=${GITHUB_SHA}"
